<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CareerWrite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="brand">Career<span>Write</span></div>
        <ul id="nav-links"></ul>
    </nav>

    <div class="form-card" style="max-width: 500px;">
        <h2>My Profile</h2>
        <p class="error-msg" id="error-msg"></p>
        <p class="success-msg" id="success-msg"></p>

        <div class="form-group">
            <label>Name</label>
            <p id="profile-name">-</p>
        </div>
        <div class="form-group">
            <label>Email</label>
            <p id="profile-email">-</p>
        </div>
        <div class="form-group">
            <label>Role</label>
            <p id="profile-role">-</p>
        </div>

        <div id="job-seeker-fields">
            <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
            <form id="profile-form">
                <div class="form-group">
                    <label for="profile-phone">Phone</label>
                    <input type="text" id="profile-phone">
                </div>
                <div class="form-group">
                    <label for="profile-skills">Skills</label>
                    <textarea id="profile-skills" placeholder="e.g. Java, Spring Boot, MySQL"></textarea>
                </div>
                <div class="form-group">
                    <label for="profile-education">Education</label>
                    <textarea id="profile-education" placeholder="e.g. B.Tech in Computer Science"></textarea>
                </div>
                <div class="form-group">
                    <label for="profile-experience">Experience</label>
                    <textarea id="profile-experience" placeholder="e.g. Fresher / 1 year internship"></textarea>
                </div>
                <button type="submit" class="btn" style="width:100%;">Save Profile</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
