<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerWrite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="brand">Career<span>Write</span></div>
        <ul id="nav-links"></ul>
    </nav>

    <div class="form-card">
        <h2>Login</h2>
        <p class="error-msg" id="error-msg"></p>
        <p class="success-msg" id="success-msg"></p>

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn" style="width:100%;">Login</button>
        </form>

        <div class="form-footer">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
        <div class="form-footer" style="margin-top:10px; color:#888;">
            Sample login: aditi.sharma@example.com / password123
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
